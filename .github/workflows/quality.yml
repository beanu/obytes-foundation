name: Quality
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-bun-install
      - run: bun run check-all
      - run: bunx expo install --check
      - run: bun run doctor
